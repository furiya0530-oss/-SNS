# このワークフローは、コードを push するたびに自動で
# GitHub Pages（スマホからも見られる公開URL）にビルド結果を反映します。
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/diary-peek-sns-react-p8n3ry
  # リポジトリの Actions タブから手動で実行したいとき用
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数のデプロイが走らないようにする
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
